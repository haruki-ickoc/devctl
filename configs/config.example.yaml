# devctl 設定ファイル例
# デフォルト検索パス: ~/.config/devctl/config.yaml またはカレントディレクトリの .devctl.yaml
version: "1"

# 全体デフォルト設定
defaults:
  compose_cmd: "docker compose" # または "docker-compose"
  env_file: ".env"

# 共通 Docker ネットワーク定義
# devctl は共通基盤やプロジェクト起動前にこのネットワークの存在を確認し、なければ自動作成します
network:
  name: "internal-network"
  driver: "bridge"
  attachable: true
  # 固定IP（Static IP）サポート用（省略時はDockerのデフォルトが適用されます）
  # subnet: "172.20.0.0/16"
  # gateway: "172.20.0.1"

# 共通インフラ基盤 (Core Services)
# リバースプロキシ、ログ基盤、共通DB などの横断サービスを管理します
core:
  # 共通基盤 docker-compose.yml / compose.yml が配置されたディレクトリ
  workdir: "~/workspace/toolbox"
  # compose_files を省略した場合、compose.yaml / compose.yml / docker-compose.yaml / docker-compose.yml が自動検出されます
  compose_files:
    - "compose.yml"
  env_file: ".env"
  services:
    traefik:
      description: "Traefik リバースプロキシ & SSL終端 (http://traefik.localhost)"
    dbgate:
      description: "DBGate Webデータベース管理クライアント (http://dbgate.localhost - 各プロジェクトの DB コンテナにアクセス可能)"
    dozzle:
      description: "Dozzle リアルタイムログビューア (http://dozzle.localhost)"

# 管理対象プロジェクト定義
projects:
  sample:
    description: "サンプルアプリケーション環境 (Laravel + MySQL)"
    # compose_files は省略時は自動検出されます。
    # 作業ディレクトリ内に compose.override.yml が存在する場合は自動マージされます。
    # 本番用 (compose.prod.yml 等) への一時切り替えは CLI フラグ (devctl up sample -f compose.prod.yml) で指定可能です。
    compose_files:
      - "compose.yml"
    env_file: "_docker/.env"
    # プロジェクト起動前に準備すべき依存関係
    depends_on:
      network: true
      core:
        - "traefik"
        - "dbgate"
    tasks:
      migrate:
        description: "データベースマイグレーションの実行"
        command: "docker compose exec app php artisan migrate"
      seed:
        description: "初期シードデータの投入"
        command: "docker compose exec app php artisan db:seed"
      test:
        description: "ユニットテストの実行"
        command: "docker compose exec app php artisan test"
      bash:
        description: "app コンテナへのシェル接続"
        command: "docker compose exec app bash"

  catchUper:
    description: "catchUper フルスタックWebサービス (Nuxt + Node.js + FastAPI)"
    workdir: "~/workspace/catchUper"
    compose_files:
      - "docker-compose.yml"
    depends_on:
      network: true
    # プロジェクト固有のカスタムタスク (Makefile 代替)
    tasks:
      logs:
        description: "全サービスのログをリアルタイム追跡"
        command: "docker compose logs -f"
      backend-sh:
        description: "backend コンテナでシェルを起動"
        command: "docker compose exec backend sh"
      scraper-sh:
        description: "scraper コンテナでシェルを起動"
        command: "docker compose exec scraper sh"
